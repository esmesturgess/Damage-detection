[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*", "mcp_server*"]

[project]
name = "damage-detection-website"
version = "0.1.0"
description = "Portable burn evidence screening: PWTT change detection, LightGBM burn classification, seismic confound, MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "shapely>=2.0.6",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "mcp>=1.2.0,<2",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.1.0"]
ml = ["lightgbm>=4.5.0", "numpy>=2.0.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
best-api = "api.main:run"
best-worker = "api.worker:run"
best-mcp = "mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]
