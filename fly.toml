app = "burn-evidence-screening"
primary_region = "lhr"

[build]

[env]
  ENABLE_LIVE_GEE = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
